<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Daamitha Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --deep-saffron: #ff6b35;
            --turmeric: #f7931e;
            --emerald: #2d5016;
            --burgundy: #800020;
            --marigold: #ffb000;
            --terracotta: #e07a5f;
            --deep-teal: #264653;
            --warm-ivory: #fdf8f5;
            --rich-cream: #f4f1eb;
            --gold-leaf: #d4af37;
            --charcoal: #2a2a2a;
            --sage: #87a96b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lora', serif;
            line-height: 1.7;
            color: var(--charcoal);
            background: url('../background.jpg');
            background-repeat: no-repeat;
            background-position: center;
            background-size: cover;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: #edd0c8;
            padding: 3rem;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            animation: fadeInUp 0.8s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo h1 {
            font-family: 'Crimson Text', serif;
            font-size: 3rem;
            color: var(--burgundy);
            margin-bottom: 0.5rem;
        }

        .logo p {
            color: var(--charcoal);
            font-style: italic;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--charcoal);
            font-weight: 500;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 0.8rem;
            font-size: 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            transition: all 0.3s ease;
            font-family: 'Lora', serif;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: var(--deep-saffron);
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        button {
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            background: var(--burgundy);
            color: white;
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .error-message {
            background: #ff6b6b;
            color: white;
            padding: 0.8rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            text-align: center;
            display: none;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .loading {
            display: none;
            text-align: center;
            color: var(--deep-saffron);
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-link a {
            color: var(--burgundy);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .back-link a:hover {
            color: var(--deep-saffron);
        }

        .forgot-password {
            text-align: right;
            margin-top: -0.5rem;
            margin-bottom: 1rem;
        }

        .forgot-password a {
            color: var(--deep-teal);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .forgot-password a:hover {
            color: var(--deep-saffron);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 1.5rem 0;
        }

        .divider::before,
        .divider::after {
            content: '';
            flex: 1;
            border-bottom: 1px solid #e0e0e0;
        }

        .divider span {
            padding: 0 1rem;
            color: #888;
            font-size: 0.9rem;
        }

        .btn-google {
            width: 100%;
            padding: 0.9rem;
            font-size: 1rem;
            font-weight: 500;
            background: white;
            color: var(--charcoal);
            border: 2px solid #e0e0e0;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            font-family: 'Lora', serif;
        }

        .btn-google:hover:not(:disabled) {
            border-color: var(--deep-saffron);
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }

        .btn-google:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-google svg {
            width: 20px;
            height: 20px;
        }

        .google-section {
            display: none;
        }

        .google-section.visible {
            display: block;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>Daamitha</h1>
            <p>Gallery Admin Portal</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>

            <div class="forgot-password">
                <a href="#" id="forgotPasswordLink">Forgot password?</a>
            </div>

            <button type="submit" id="submitBtn">Login to Dashboard</button>

            <div class="loading" id="loading">
                <p>Authenticating...</p>
            </div>
        </form>

        <div class="google-section" id="googleSection">
            <div class="divider">
                <span>or</span>
            </div>

            <button type="button" class="btn-google" id="googleLoginBtn" disabled>
                <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                    <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                    <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                    <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z"/>
                    <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                </svg>
                Continue with Google
            </button>
        </div>

        <div class="back-link">
            <a href="/">← Back to Gallery</a>
        </div>
    </div>

    <script>
        // Better Auth sign-in endpoint
        const AUTH_BASE = '/api/auth';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');

            errorMessage.style.display = 'none';
            submitBtn.disabled = true;
            loading.style.display = 'block';

            try {
                // Use Better Auth sign-in endpoint
                const response = await fetch(`${AUTH_BASE}/sign-in/email`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include', // Important for cookies
                    body: JSON.stringify({ email, password }),
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || data.error || 'Login failed');
                }

                // Verify user has admin role
                const sessionResponse = await fetch(`${AUTH_BASE}/me`, {
                    credentials: 'include'
                });

                const sessionData = await sessionResponse.json();

                if (!sessionData.authenticated) {
                    throw new Error('Failed to verify session');
                }

                if (sessionData.user.role !== 'admin') {
                    // Sign out if not admin
                    await fetch(`${AUTH_BASE}/sign-out`, {
                        method: 'POST',
                        credentials: 'include'
                    });
                    throw new Error('Access denied. Admin privileges required.');
                }

                // Store user info for display (session is in httpOnly cookie)
                localStorage.setItem('user', JSON.stringify(sessionData.user));

                // Redirect to dashboard
                window.location.href = '/admin/dashboard.html';
            } catch (error) {
                errorMessage.textContent = error.message;
                errorMessage.style.display = 'block';
                submitBtn.disabled = false;
                loading.style.display = 'none';
            }
        });

        // Forgot password handler
        document.getElementById('forgotPasswordLink').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;

            if (!email) {
                alert('Please enter your email address first.');
                document.getElementById('email').focus();
                return;
            }

            try {
                const response = await fetch(`${AUTH_BASE}/forgot-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email }),
                });

                if (response.ok) {
                    alert('If an account exists with this email, you will receive password reset instructions.');
                } else {
                    const data = await response.json();
                    alert(data.message || 'Failed to send reset email. Please try again.');
                }
            } catch (error) {
                alert('Failed to send reset email. Please try again later.');
            }
        });

        // Check if already logged in and check Google OAuth availability
        window.addEventListener('load', async () => {
            try {
                // Check if already logged in
                const response = await fetch(`${AUTH_BASE}/me`, {
                    credentials: 'include'
                });

                const data = await response.json();

                if (data.authenticated && data.user.role === 'admin') {
                    window.location.href = '/admin/dashboard.html';
                    return;
                }

                // Check if Google OAuth is available
                const providersResponse = await fetch(`${AUTH_BASE}/providers`);
                const providers = await providersResponse.json();

                if (providers.google) {
                    document.getElementById('googleSection').classList.add('visible');
                    document.getElementById('googleLoginBtn').disabled = false;
                }
            } catch (error) {
                console.error('Session check failed:', error);
            }
        });

        // Google OAuth login handler
        document.getElementById('googleLoginBtn').addEventListener('click', async () => {
            const btn = document.getElementById('googleLoginBtn');
            const errorMessage = document.getElementById('errorMessage');

            btn.disabled = true;
            errorMessage.style.display = 'none';

            try {
                // POST to Better Auth social sign-in endpoint
                const response = await fetch(`${AUTH_BASE}/sign-in/social`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    credentials: 'include',
                    body: JSON.stringify({
                        provider: 'google',
                        callbackURL: window.location.origin + '/admin/login.html'
                    })
                });

                const data = await response.json();

                if (data.url) {
                    // Redirect to Google OAuth
                    window.location.href = data.url;
                } else if (data.redirect) {
                    window.location.href = data.redirect;
                } else {
                    throw new Error('No redirect URL received');
                }
            } catch (error) {
                errorMessage.textContent = error.message || 'Failed to initiate Google login';
                errorMessage.style.display = 'block';
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
