<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Daamitha Gallery</title>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Text:ital,wght@0,400;0,600;1,400&family=Lora:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <style>
        :root {
            --deep-saffron: #ff6b35;
            --turmeric: #f7931e;
            --emerald: #2d5016;
            --burgundy: #800020;
            --marigold: #ffb000;
            --terracotta: #e07a5f;
            --deep-teal: #264653;
            --warm-ivory: #fdf8f5;
            --rich-cream: #f4f1eb;
            --gold-leaf: #d4af37;
            --charcoal: #2a2a2a;
            --sage: #87a96b;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Lora', serif;
            line-height: 1.7;
            color: var(--charcoal);
            background: linear-gradient(135deg, var(--deep-saffron) 0%, var(--turmeric) 30%, var(--terracotta) 70%, var(--burgundy) 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .login-container {
            background: var(--warm-ivory);
            padding: 3rem;
            border-radius: 25px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            width: 100%;
            max-width: 450px;
            animation: fadeInUp 0.8s ease;
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .logo {
            text-align: center;
            margin-bottom: 2rem;
        }

        .logo h1 {
            font-family: 'Crimson Text', serif;
            font-size: 3rem;
            color: var(--burgundy);
            margin-bottom: 0.5rem;
        }

        .logo p {
            color: var(--charcoal);
            font-style: italic;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        label {
            display: block;
            margin-bottom: 0.5rem;
            color: var(--charcoal);
            font-weight: 500;
        }

        input[type="email"],
        input[type="password"] {
            width: 100%;
            padding: 0.8rem;
            font-size: 1rem;
            border: 2px solid #e0e0e0;
            border-radius: 10px;
            transition: all 0.3s ease;
            font-family: 'Lora', serif;
        }

        input[type="email"]:focus,
        input[type="password"]:focus {
            outline: none;
            border-color: var(--deep-saffron);
            box-shadow: 0 0 0 3px rgba(255, 107, 53, 0.1);
        }

        button {
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            background: linear-gradient(45deg, var(--gold-leaf), var(--marigold));
            color: var(--charcoal);
            border: none;
            border-radius: 25px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 6px 20px rgba(0,0,0,0.2);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        button:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .error-message {
            background: #ff6b6b;
            color: white;
            padding: 0.8rem;
            border-radius: 10px;
            margin-bottom: 1rem;
            text-align: center;
            display: none;
            animation: shake 0.5s;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
            20%, 40%, 60%, 80% { transform: translateX(5px); }
        }

        .loading {
            display: none;
            text-align: center;
            color: var(--deep-saffron);
        }

        .back-link {
            text-align: center;
            margin-top: 1.5rem;
        }

        .back-link a {
            color: var(--burgundy);
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .back-link a:hover {
            color: var(--deep-saffron);
        }

        .forgot-password {
            text-align: right;
            margin-top: -0.5rem;
            margin-bottom: 1rem;
        }

        .forgot-password a {
            color: var(--deep-teal);
            text-decoration: none;
            font-size: 0.9rem;
        }

        .forgot-password a:hover {
            color: var(--deep-saffron);
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="logo">
            <h1>Daamitha</h1>
            <p>Gallery Admin Portal</p>
        </div>

        <div class="error-message" id="errorMessage"></div>

        <form id="loginForm">
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" id="email" name="email" required autocomplete="email">
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>

            <div class="forgot-password">
                <a href="#" id="forgotPasswordLink">Forgot password?</a>
            </div>

            <button type="submit" id="submitBtn">Login to Dashboard</button>

            <div class="loading" id="loading">
                <p>Authenticating...</p>
            </div>
        </form>

        <div class="back-link">
            <a href="/">← Back to Gallery</a>
        </div>
    </div>

    <script>
        // Better Auth sign-in endpoint
        const AUTH_BASE = '/api/auth';

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;
            const errorMessage = document.getElementById('errorMessage');
            const submitBtn = document.getElementById('submitBtn');
            const loading = document.getElementById('loading');

            errorMessage.style.display = 'none';
            submitBtn.disabled = true;
            loading.style.display = 'block';

            try {
                // Use Better Auth sign-in endpoint
                const response = await fetch(`${AUTH_BASE}/sign-in/email`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    credentials: 'include', // Important for cookies
                    body: JSON.stringify({ email, password }),
                });

                const data = await response.json();

                if (!response.ok) {
                    throw new Error(data.message || data.error || 'Login failed');
                }

                // Verify user has admin role
                const sessionResponse = await fetch(`${AUTH_BASE}/me`, {
                    credentials: 'include'
                });

                const sessionData = await sessionResponse.json();

                if (!sessionData.authenticated) {
                    throw new Error('Failed to verify session');
                }

                if (sessionData.user.role !== 'admin') {
                    // Sign out if not admin
                    await fetch(`${AUTH_BASE}/sign-out`, {
                        method: 'POST',
                        credentials: 'include'
                    });
                    throw new Error('Access denied. Admin privileges required.');
                }

                // Store user info for display (session is in httpOnly cookie)
                localStorage.setItem('user', JSON.stringify(sessionData.user));

                // Redirect to dashboard
                window.location.href = '/admin/dashboard.html';
            } catch (error) {
                errorMessage.textContent = error.message;
                errorMessage.style.display = 'block';
                submitBtn.disabled = false;
                loading.style.display = 'none';
            }
        });

        // Forgot password handler
        document.getElementById('forgotPasswordLink').addEventListener('click', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;

            if (!email) {
                alert('Please enter your email address first.');
                document.getElementById('email').focus();
                return;
            }

            try {
                const response = await fetch(`${AUTH_BASE}/forgot-password`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ email }),
                });

                if (response.ok) {
                    alert('If an account exists with this email, you will receive password reset instructions.');
                } else {
                    const data = await response.json();
                    alert(data.message || 'Failed to send reset email. Please try again.');
                }
            } catch (error) {
                alert('Failed to send reset email. Please try again later.');
            }
        });

        // Check if already logged in
        window.addEventListener('load', async () => {
            try {
                const response = await fetch(`${AUTH_BASE}/me`, {
                    credentials: 'include'
                });

                const data = await response.json();

                if (data.authenticated && data.user.role === 'admin') {
                    window.location.href = '/admin/dashboard.html';
                }
            } catch (error) {
                console.error('Session check failed:', error);
            }
        });
    </script>
</body>
</html>
