<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>About - Daamitha Gallery</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #264653, #2a9d8f);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            background: white;
            padding: 60px;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            max-width: 600px;
            text-align: center;
        }

        h1 {
            color: #264653;
            font-size: 2.5rem;
            margin-bottom: 20px;
        }

        p {
            color: #555;
            font-size: 1.1rem;
            line-height: 1.8;
            margin-bottom: 30px;
        }

        a {
            display: inline-block;
            background: #2a9d8f;
            color: white;
            padding: 12px 30px;
            border-radius: 25px;
            text-decoration: none;
            font-weight: 600;
            transition: background 0.3s;
        }

        a:hover {
            background: #264653;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎨 About This Gallery</h1>
        <p>This page serves as a placeholder for future content about Daamitha's artistic journey, exhibitions, and creative process.</p>
        <p>Check back soon for updates!</p>
        <a href="/">← Back to Gallery</a>
    </div>
</body>
</html>
